<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AJAX Application - State/City List</title>
<style>
  body { font-family: Arial; margin: 30px; }
  select { padding: 6px; font-size: 14px; }
  table { border-collapse: collapse; margin-top: 20px; width: 300px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background-color: #1b3a63; color: white; }
</style>
</head>
<body>

  <h2>Important Cities by State (AJAX Demo)</h2>

  <label for="stateSelect">Select State:</label>
  <select id="stateSelect" onchange="loadCities()">
    <option value="">--Select--</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Telangana">Telangana</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Maharashtra">Maharashtra</option>
  </select>

  <table id="cityTable" style="display:none;">
    <thead>
      <tr><th>City</th></tr>
    </thead>
    <tbody id="cityTableBody"></tbody>
  </table>

<script src="01-city-dropdown.js"></script>
</body>
</html>
