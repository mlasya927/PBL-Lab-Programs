<!DOCTYPE html>
<html>
<head><title>Two Lists</title></head>
<body>
  <h3>Ordered List - Favorite Fruits</h3>
  <ol>
    <li>Mango</li>
    <li>Banana</li>
    <li>Apple</li>
    <li>Orange</li>
  </ol>

  <h3>Unordered List - Favorite Colors</h3>
  <ul>
    <li>Blue</li>
    <li>Green</li>
    <li>Red</li>
    <li>Yellow</li>
  </ul>
</body>
</html>
