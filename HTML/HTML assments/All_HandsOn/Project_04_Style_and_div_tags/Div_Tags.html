<!DOCTYPE html>
<html>
<head>
<title>Div Tags - Grouped Forms</title>
<style>
  #visitorFormDiv, #registrationFormDiv {
    margin-bottom: 30px;
  }
  table { border-collapse: collapse; }
  td { padding: 6px; }
  #registrationFormDiv { text-align: center; }
  #registrationFormDiv table { margin: 0 auto; text-align: left; }
</style>
</head>
<body>

  <div id="visitorFormDiv">
    <h2>Visitors information</h2>
    <hr>
    <form action="#" method="post">
      <table>
        <tr>
          <td>Email address:</td>
          <td><input type="text" name="email"></td>
        </tr>
        <tr>
          <td>Interest in web for:</td>
          <td>
            <input type="checkbox" name="research" value="research"> Research
            <input type="checkbox" name="purchase" value="purchase"> Purchase
          </td>
        </tr>
        <tr>
          <td>Occupation:</td>
          <td>
            <select name="occupation">
              <option>select one</option>
              <option value="student">Student</option>
              <option value="employee">Employee</option>
              <option value="business">Business</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Want us to send you junk emails?</td>
          <td>
            <input type="radio" name="junk" value="absolutely"> Absolutely
            <input type="radio" name="junk" value="nowayman"> No way man
          </td>
        </tr>
      </table>
      <br>
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </form>
  </div>

  <div id="registrationFormDiv">
    <h2>Online Registration</h2>
    <form action="#" method="post">
      <table>
        <tr><td>Username:</td><td><input type="text" name="username"></td></tr>
        <tr><td>Password:</td><td><input type="password" name="password"></td></tr>
        <tr><td>Confirm Password:</td><td><input type="password" name="confirmpassword"></td></tr>
        <tr><td>Name:</td><td><input type="text" name="name"></td></tr>
        <tr>
          <td>Gender:</td>
          <td>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
          </td>
        </tr>
        <tr><td>Address:</td><td><textarea name="address" rows="4" cols="30"></textarea></td></tr>
        <tr>
          <td>Profession:</td>
          <td>
            <select name="profession">
              <option>select one</option>
              <option value="engineer">Engineer</option>
              <option value="doctor">Doctor</option>
              <option value="teacher">Teacher</option>
            </select>
          </td>
        </tr>
        <tr><td></td><td><input type="submit" value="Register"></td></tr>
      </table>
    </form>
  </div>

</body>
</html>
