<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
  body { text-align: center; font-family: Arial, sans-serif; }
  h2 { color: #0055A5; }
  table { margin: 20px auto; border-collapse: collapse; }
  td { padding: 8px; text-align: left; }
  input[type="text"], input[type="password"] { background-color: #17c3c3; border: none; padding: 5px; }
  input[type="submit"] { background-color: #17c3c3; border: none; padding: 5px 15px; }
</style>
</head>
<body>
  <h2>Account Login</h2>
  <form action="#" method="post">
    <table>
      <tr><td>User Name:</td><td><input type="text" name="username" maxlength="8"></td></tr>
      <tr><td>Password:</td><td><input type="password" name="password" maxlength="8"></td></tr>
      <tr><td></td><td><input type="submit" value="Login"></td></tr>
    </table>
  </form>
</body>
</html>
